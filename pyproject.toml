[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-foundry"
version = "0.1.0"
description = "SAPIENT Network Tactical Scenario and Sensor Telemetry Generator"
authors = [
    { name = "Lempea Edge Oy / DEFINE AI Foundry" }
]
readme = "README.md"
# Union type syntax (str | Path) in the codebase requires 3.10+
requires-python = ">=3.10"

# These are the packages installed automatically when someone runs `pip install -e .`
dependencies = [
    "python-dotenv==1.1.1",
    "jsonschema",
    "shapely",
    "protobuf>=4.25.8",
    "zipp>=3.19.1",
    "numpy>=1.22.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

# OPTIONAL BUT HIGHLY RECOMMENDED: 
# This turns your scripts into system-wide command line tools.
[project.scripts]
generate-scenario = "scenario_foundry.generate_scenario:main"
generate-sensor-data = "scenario_foundry.generation.generate_sensor_data:main"
optimize-vectors = "scenario_foundry.generation.optimize_vectors:main"
export-scenario = "scenario_foundry.export_scenario:main"

# This is the magic that fixes your ModuleNotFoundError. 
# It tells Python that your actual code is hidden inside the src/ folder.
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
# Generated protobuf bindings are not ours to lint.
extend-exclude = ["src/sapient_msg"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "S311",  # pseudo-random generators: used for simulation noise, not crypto
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # asserts are the point of tests
    "S603",  # subprocess calls in CLI tests are trusted
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=scenario_foundry --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["scenario_foundry"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]